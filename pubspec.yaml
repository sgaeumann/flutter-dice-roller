name: dice_roller
description: "A Flutter application for rolling one or two dices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dice1.png
    - assets/dice2.png
    - assets/dice3.png
    - assets/dice4.png
    - assets/dice5.png
    - assets/dice6.png